<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern web calculator interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <input class="display-area" type="text" placeholder="0">
    <div class="button-row">
      <button class="action">AC</button>
      <button>00</button>
      <button>&percnt;</button>
      <button class="operator">&div;</button>
    </div>
    <div class="button-row">
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator">&times;</button>
    </div>
    <div class="button-row">
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="operator">&minus;</button>
    </div>
    <div class="button-row">
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="operator">&plus;</button>
    </div>

    <div class="button-row">
      <button id="long">0</button>
      <button>&period;</button>
      <button class="operator">&equals;</button>
    </div>
  </div>
</body>
</html>
